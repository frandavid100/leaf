name: Focused installed input investigation
on:
  push:
    branches: [fix/sidebar-format-input]
permissions:
  contents: read
  actions: read
jobs:
  focus:
    if: contains(github.event.head_commit.message, '[focus-input]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LC_ALL: en_US.UTF-8
      LANGUAGE: es
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Instalar bibliotecas GNOME y pantalla virtual
        run: |
          # Azure's HTTP package mirror stalled on the runner; use Ubuntu HTTPS.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if path.is_file():
                  text = path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  path.write_text(text)
          for name, uri in [('apt-mirrors.txt', 'https://archive.ubuntu.com/ubuntu'), ('apt-security-mirrors.txt', 'https://security.ubuntu.com/ubuntu')]:
              path = Path('/etc/apt') / name
              if path.is_file():
                  path.write_text(uri + '\n')
          PY
          sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev xvfb xauth scrot xdotool adwaita-icon-theme librsvg2-common xcompmgr poppler-utils gettext locales dbus-x11 flatpak desktop-file-utils appstream fuse3 libgtk-3-bin xdg-desktop-portal xdg-desktop-portal-gtk
          sudo locale-gen en_US.UTF-8
      - name: Normalize metadata and compile focused binary
        run: |
          cargo fmt --package wordcraft-gnome
          python tools/update_translations.py --compile
          git diff > normalized.patch
          cargo test --locked --test highlight
          cargo build --release --locked --features gui --bin wordcraft-gnome
      - name: Install the identical GNOME 49 bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          gh release download v0.1.0-alpha.28 --pattern 'Leaf-0.1.0-alpha.28-x86_64.flatpak' --dir prior-release
          bash packaging/build-bundle.sh target/release/wordcraft-gnome
      - name: Run the published input regression in its installed precondition
        run: |
          python - <<'PREFIX'
          from pathlib import Path
          source=Path('packaging/smoke-test.sh').read_text()
          prefix=source.split("# Acknowledgements use",1)[0]
          Path('input-prefix.sh').write_text(prefix)
          PREFIX
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash input-prefix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-input-evidence
          path: |
            dist/
            normalized.patch
            interactions-pointer.log
            vista-texto*.png
            target/release/wordcraft-gnome
