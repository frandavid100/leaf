name: Optional source formatting and module migration check
on:
  push:
    branches: [wordcraft-saving]
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.head_commit.message, '[maintenance-format]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install GTK build libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Format Leaf-owned Rust sources
        run: |
          find src tests examples -name '*.rs' -print0 | xargs -0 rustfmt --edition 2024 --config skip_children=true
          tar -czf formatted-leaf-source.tar.gz src tests examples
      - name: Check module boundaries
        run: |
          set -o pipefail
          cargo check --locked --features gui --bin wordcraft-gnome 2>&1 | tee module-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-maintainability-source
          path: |
            formatted-leaf-source.tar.gz
            module-check.log
