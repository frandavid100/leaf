name: Publish a validated Alpha candidate without rebuilding
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 'Successful candidate workflow run authorized for publication'
        required: true
        type: string
  workflow_run:
    workflows: ["Leaf — build, test and package"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       contains(github.event.workflow_run.head_commit.message, '[candidate-alpha]') &&
       contains(github.event.workflow_run.head_commit.message, '[auto-publish-alpha]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify candidate run identity and success
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run || github.event.workflow_run.id }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > run.json
          python3 - <<'PY'
          import json
          r = json.load(open('run.json'))
          assert r['conclusion'] == 'success'
          assert r['head_branch'] == 'main' and r['event'] == 'push'
          assert r['path'] == '.github/workflows/wordcraft-gnome.yml'
          assert '[candidate-alpha]' in r['head_commit']['message']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: leaf-flatpak-alpha
          path: dist
          run-id: ${{ inputs.candidate_run || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify exact approved source, version and package checksums
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run || github.event.workflow_run.id }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          python3 - <<'PY'
          import json, os, pathlib, re
          c = json.load(open('dist/candidate.json'))
          r = json.load(open('run.json'))
          assert c['run_id'] == int(os.environ['CANDIDATE_RUN'])
          assert c['source'] == r['head_sha'] == pathlib.Path('dist/source-commit.txt').read_text().strip()
          assert re.fullmatch(r'0\.1\.0-alpha\.[1-9][0-9]*', c['version'])
          assert re.fullmatch(r'[0-9a-f]{40}', c['source'])
          assert re.fullmatch(r'[0-9a-f]{40}', c['native_source'])
          assert isinstance(c['native_run_id'], int) and c['native_run_id'] > 0
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LEAF_APPROVED_VERSION=' + c['version'] + '\n')
              f.write('LEAF_APPROVED_SOURCE=' + c['source'] + '\n')
              f.write('LEAF_APPROVED_NATIVE_RUN=' + str(c['native_run_id']) + '\n')
          PY
      - name: Recheck native validation before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LEAF_APPROVED_NATIVE_RUN" > native-run.json
          python3 - <<'PY'
          import json
          c = json.load(open('dist/candidate.json'))
          r = json.load(open('native-run.json'))
          assert r['conclusion'] == 'success'
          assert r['head_sha'] == c['native_source']
          assert r['path'] == '.github/workflows/wordcraft-gnome.yml'
          PY
      - name: Publish the already tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$LEAF_APPROVED_VERSION" \
            "dist/Leaf-$LEAF_APPROVED_VERSION-x86_64.flatpak" \
            "dist/Leaf-$LEAF_APPROVED_VERSION-flatpark-x86_64.tar.xz" \
            dist/SHA256SUMS dist/INSTALL.md dist/source-commit.txt dist/runtime.txt \
            dist/runtime-commit.txt dist/flatpak-metadata.txt dist/flatpak-smoke.log \
            dist/flatpark-smoke.log dist/candidate.json dist/RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY" --target "$LEAF_APPROVED_SOURCE" \
            --title "Leaf $LEAF_APPROVED_VERSION" --prerelease \
            --notes-file dist/RELEASE_NOTES.md
