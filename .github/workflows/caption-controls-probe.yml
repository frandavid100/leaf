name: Compare installed control delivery
on:
  push:
    branches: [verify/caption-installed-controls]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        build: [standalone, combined]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0153cd23368778f5065a2e9d0864f8c5f2ffe830
      - name: Install native test tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 120s apt-get -o Acquire::Retries=1 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get install -y --no-install-recommends flatpak xvfb xauth xdotool scrot dbus-x11 locales x11-utils xinput
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo locale-gen en_US.UTF-8
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user config --set languages 'en;es'
      - uses: actions/download-artifact@v4
        with:
          name: leaf-flatpak-alpha
          run-id: 42296908566
          github-token: ${{ github.token }}
          path: candidate
      - name: Install exact comparison binary
        run: |
          sha256sum candidate/Leaf-0.1.0-alpha.31-x86_64.flatpak
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49
          flatpak --user install -y --noninteractive candidate/Leaf-0.1.0-alpha.31-x86_64.flatpak
          flatpak --user info --show-commit org.gnome.Platform//49
          mkdir -p out "$HOME/.var/app/io.github.frandavid100.leaf/cache"
          cat > "$RUNNER_TEMP/installed.sh" <<'RUNNER'
          #!/usr/bin/env bash
          exec flatpak run --user --branch=alpha --socket=x11 --nosocket=wayland --env=LC_ALL=en_US.UTF-8 --env=LANGUAGE="${LANGUAGE:-en}" --env=GDK_SCALE="${GDK_SCALE:-1}" --env=GDK_DEBUG=events --env=GSK_RENDERER=cairo --env=LEAF29_ACK_DIR="$LEAF29_ACK_DIR" --command=sh io.github.frandavid100.leaf -c 'export XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d); exec /app/bin/leaf "$@"' leaf "$@"
          RUNNER
      - name: Trace unchanged pointer delivery alone and after earlier stages
        env:
          BUILD: ${{ matrix.build }}
        run: |
          export LEAF29_ACK_PARENT="$HOME/.var/app/io.github.frandavid100.leaf/cache"
          export LEAF29_ACK_DIR
          LEAF29_ACK_DIR=$(mktemp -d "$LEAF29_ACK_PARENT/probe.XXXXXX")
          export LEAF_PROBE_RUNNER="$RUNNER_TEMP/installed.sh"
          mkdir -p out/tools
          cp tools/*pointer-test.sh out/tools/
          cat > "$RUNNER_TEMP/probe-session.sh" <<'PROBE'
          #!/usr/bin/env bash
          xinput test-xi2 --root > xinput-events.log 2>&1 &
          trace=$!
          trap 'kill "$trace" 2>/dev/null || true' EXIT
          set +e
          if test "$BUILD" = combined; then
            bash tools/alpha30-pointer-test.sh "$LEAF_PROBE_RUNNER" >alpha30-driver.log 2>&1
            echo "ALPHA30_EXIT=$?"
            bash tools/alpha31-pointer-test.sh "$LEAF_PROBE_RUNNER" >alpha31-driver.log 2>&1
            echo "ALPHA31_EXIT=$?"
          fi
          xinput list --long > input-before-format.log
          bash tools/format136-pointer-test.sh "$LEAF_PROBE_RUNNER" >format-driver.log 2>&1
          echo "FORMAT_EXIT=$?" | tee format-result.log
          xinput list --long > input-after-format.log
          bash tools/caption-pointer-test.sh "$LEAF_PROBE_RUNNER" >caption-driver.log 2>&1
          echo "CAPTION_EXIT=$?" | tee caption-result.log
          PROBE
          cd out
          LANGUAGE=en GDK_SCALE=1 xvfb-run -a -s '-screen 0 1400x1100x24' dbus-run-session -- timeout 230s bash "$RUNNER_TEMP/probe-session.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-controls-${{ matrix.build }}
          path: out/
          retention-days: 7
