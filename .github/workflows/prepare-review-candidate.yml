name: Prepare Leaf Review candidate metadata
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-review-candidate]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha31-review-only
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install gettext
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          for p in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]:
              if p.is_file():
                  p.write_text(p.read_text().replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu'))
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
      - name: Normalize and verify candidate metadata
        run: |
          cargo fmt --package wordcraft-gnome
          python tools/update_translations.py --compile
          cargo fmt --package wordcraft-gnome -- --check
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/check_project_docs.py
          python tools/update_translations.py --check --compile
          bash -n tools/alpha31-pointer-test.sh
          git diff --check
          git diff --exit-code -- Cargo.toml Cargo.lock vendor patches
      - name: Save only generated client metadata
        run: |
          if git diff --quiet; then exit 0; fi
          git add src po
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize Review candidate formatting and translation references'
          git push origin HEAD:fix/alpha31-review-only
