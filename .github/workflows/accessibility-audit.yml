name: Optional real AT-SPI and Orca document audit
on:
  workflow_dispatch:
  push:
    branches: [wordcraft-saving]
    paths: ['tools/accessibility_audit.py', '.github/workflows/accessibility-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  a11y:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[a11y-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wordcraft-gnome-fase3d-linux
          path: baseline-artifact
          run-id: '41299085582'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: wordcraft-gnome-fase3d-linux
          path: native-artifact
          run-id: '41320879043'
          github-token: ${{ github.token }}
      - name: Verify tested implementation is unchanged
        run: git diff --exit-code 3d5e6826ec6311b23dcaac638a580cf76be2d04e -- src Cargo.toml Cargo.lock tests vendor po data
      - name: Install independent assistive technology clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libadwaita-1-0 xvfb xauth xdotool openbox orca python3-pyatspi dbus-x11 at-spi2-core gsettings-desktop-schemas
          chmod +x native-artifact/wordcraft-gnome baseline-artifact/wordcraft-gnome
      - name: Probe original canvas through AT-SPI and Orca
        env:
          GTK_A11Y: atspi
          NO_AT_BRIDGE: '0'
          GSK_RENDERER: cairo
          LANGUAGE: en
          LANG: C.UTF-8
          XDG_SESSION_TYPE: x11
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 tools/accessibility_audit.py baseline-artifact/wordcraft-gnome --baseline
          mv a11y-results a11y-baseline-results
      - name: Query and edit real document through AT-SPI with Orca running
        env:
          GTK_A11Y: atspi
          NO_AT_BRIDGE: '0'
          GSK_RENDERER: cairo
          LANGUAGE: en
          LANG: C.UTF-8
          XDG_SESSION_TYPE: x11
          XDG_CURRENT_DESKTOP: GNOME
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tools/accessibility_audit.py native-artifact/wordcraft-gnome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-accessibility-audit
          path: |
            a11y-results/
            a11y-baseline-results/
