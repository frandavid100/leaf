name: Alpha31 installed locale acceptance
on:
  push:
    branches: [verify/alpha31-installed-locale]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [49, 51]
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 120s apt-get -o Acquire::Retries=1 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get install -y --no-install-recommends flatpak xvfb xauth xdotool scrot dbus-x11 locales
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo locale-gen en_US.UTF-8
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user config --set languages 'en;es'
      - uses: actions/download-artifact@v4
        with:
          name: leaf-flatpak-alpha
          run-id: 42265503961
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify frozen candidate
        run: |
          cd candidate
          sha256sum -c SHA256SUMS
          echo 'c1475a7c8e4f6c1529d4ca0158004f68425158f9d6c0efaf92db9c9d26932b28  Leaf-0.1.0-alpha.31-x86_64.flatpak' | sha256sum -c
          echo 'ae622d43563694c0eeedaf75228dce7589426075dc5994be4fe9ed5a57356c96  Leaf-0.1.0-alpha.31-flatpark-x86_64.tar.xz' | sha256sum -c
      - name: GNOME49 installed bilingual controls
        if: matrix.runtime == 49
        run: |
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49
          flatpak --user install -y --noninteractive candidate/Leaf-0.1.0-alpha.31-x86_64.flatpak
          mkdir -p "$HOME/.var/app/io.github.frandavid100.leaf/cache" out/tools
          cp tools/alpha30-pointer-test.sh tools/alpha31-pointer-test.sh tools/format136-pointer-test.sh tools/caption-pointer-test.sh out/tools/
          cat > "$RUNNER_TEMP/locale-run.sh" <<'RUNNER'
          #!/usr/bin/env bash
          exec flatpak run --user --branch=alpha --socket=x11 --nosocket=wayland --env=LC_ALL=en_US.UTF-8 --env=LANGUAGE="${LANGUAGE:-en}" --env=GDK_SCALE="${GDK_SCALE:-1}" --env=GSK_RENDERER=cairo --env=LEAF29_ACK_DIR="$LEAF29_ACK_DIR" --command=sh io.github.frandavid100.leaf -c 'export XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d); exec /app/bin/leaf "$@"' leaf "$@"
          RUNNER
          export LEAF29_ACK_PARENT="$HOME/.var/app/io.github.frandavid100.leaf/cache"
          export LEAF29_DRIVER="$PWD/tools/alpha29-pointer-test.sh"
          cd out
          LANGUAGE=en GDK_SCALE=1 xvfb-run -a -s '-screen 0 1400x1100x24' dbus-run-session -- timeout 180s bash "$LEAF29_DRIVER" "$RUNNER_TEMP/locale-run.sh"
          LANGUAGE=es GDK_SCALE=2 xvfb-run -a -s '-screen 0 2800x2200x24' dbus-run-session -- timeout 180s bash "$LEAF29_DRIVER" "$RUNNER_TEMP/locale-run.sh"
      - name: GNOME51 relocated bilingual controls
        if: matrix.runtime == 51
        run: xvfb-run -a -s '-screen 0 1400x1100x24' dbus-run-session -- bash packaging/flatpark-smoke.sh candidate/Leaf-0.1.0-alpha.31-flatpark-x86_64.tar.xz out
      - name: Require actual translated property titles
        run: |
          grep -q 'title=Font' out/alpha31-format136-en-1.log
          grep -q 'title=Fuente' out/alpha31-format136-es-2.log
          grep -q 'title=Idioma' out/alpha31-format136-es-2.log
          grep -q FORMAT136_UI_OK out/alpha31-format136-es-2.log
          grep -q ALPHA31_UI_OK out/alpha31-es-2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha31-localized-${{ matrix.runtime }}
          path: out/
          retention-days: 90
