name: Optional text pointer diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  text-pointer:
    if: contains(github.event.pull_request.title, '[text-debug]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the same native GTK runtime and pointer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libadwaita-1-0 xvfb xauth xdotool scrot xclip adwaita-icon-theme librsvg2-common
      - name: Select only this source's unpublished diagnostic executable
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$EXPECTED_SOURCE" -- src Cargo.toml Cargo.lock build.rs vendor data po
          for attempt in $(seq 1 100); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$EXPECTED_SOURCE&per_page=20" > runs.json
            run=$(python3 -c "import json; r=[r for r in json.load(open('runs.json'))['workflow_runs'] if r['path']=='.github/workflows/wordcraft-gnome.yml']; print(r[0]['id'] if r else '')")
            if test -n "$run" && gh run download "$run" --name leaf-native-unvalidated --dir native 2>/dev/null; then break; fi
            sleep 5
          done
          test -s native/wordcraft-gnome
          chmod +x native/wordcraft-gnome
      - name: Observe the native pointer regression through its own timeout
        env:
          LANGUAGE: es
          GSK_RENDERER: cairo
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d)
          xvfb-run -a -s '-screen 0 2800x2200x24' timeout 90s bash tools/text-pointer-test.sh "$PWD/native/wordcraft-gnome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-pointer-diagnostic
          path: text18-*
