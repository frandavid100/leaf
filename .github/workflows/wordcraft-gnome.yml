name: "Leaf — build, test and package"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    env:
      LC_ALL: en_US.UTF-8
      LANGUAGE: es
    if: ${{ !contains(github.event.head_commit.message, '[bundle-only]') && !contains(github.event.head_commit.message, '[lifecycle-baseline]') && !contains(github.event.head_commit.message, '[interop-audit-only]') && !contains(github.event.head_commit.message, '[perf-baseline]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare pinned WordCraft Language data
        run: bash tools/prepare-language-data.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas GNOME y pantalla virtual
        run: |
          # Azure's HTTP package mirror stalled on the runner; use Ubuntu HTTPS.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if path.is_file():
                  text = path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  path.write_text(text)
          for name, uri in [('apt-mirrors.txt', 'https://archive.ubuntu.com/ubuntu'), ('apt-security-mirrors.txt', 'https://security.ubuntu.com/ubuntu')]:
              path = Path('/etc/apt') / name
              if path.is_file():
                  path.write_text(uri + '\n')
          PY
          sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev xvfb xauth scrot xclip xdotool adwaita-icon-theme librsvg2-common xcompmgr poppler-utils gettext locales dbus-x11
          sudo locale-gen en_US.UTF-8
      - name: Check Leaf formatting and contributor entry points
        run: |
          cargo fmt --package wordcraft-gnome -- --check
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/check_project_docs.py
      - name: Validate and compile gettext catalogs
        run: python tools/update_translations.py --check --compile
      - name: Tests sin interfaz
        run: cargo test --locked
      - name: Recheck ODT corpus for this preservation fix only
        if: contains(github.event.head_commit.message, '[odt-audit]')
        run: |
          python -m pip install pillow==11.3.0
          cargo build --release --locked --example corpus_audit
          AUDIT_KEEP_SAVED=1 python tools/corpus_audit.py
      - name: Check repaired ODT files in LibreOffice for this fix only
        if: contains(github.event.head_commit.message, '[odt-audit]')
        run: |
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          for case in 16-table_styles_1 18-nestedTableInFooter 22-tdf135338_firstLeftPageFooter 24-tdf104254_noHeaderWrapping; do
            folder="audit-results/$case"
            mkdir -p "$folder/libreoffice"
            timeout 40s libreoffice -env:UserInstallation=file:///tmp/leaf-odt-check --headless --convert-to pdf --outdir "$folder/libreoffice" "$folder/saved.odt"
            test -s "$folder/libreoffice/saved.pdf"
            pdftoppm -f 1 -singlefile -scale-to 1100 -png "$folder/libreoffice/saved.pdf" "$folder/libreoffice/page-1"
            pdftotext "$folder/libreoffice/saved.pdf" "$folder/libreoffice/text.txt"
          done
          grep -q 'Some text, all on one line' audit-results/24-tdf104254_noHeaderWrapping/libreoffice/text.txt
          grep -q 'First (Left page only)' audit-results/22-tdf135338_firstLeftPageFooter/libreoffice/text.txt
          grep -q 'EVEN/LEFT (Left page only)' audit-results/22-tdf135338_firstLeftPageFooter/libreoffice/text.txt
          grep -q 'odd/right (Left page only)' audit-results/22-tdf135338_firstLeftPageFooter/libreoffice/text.txt
          echo LIBREOFFICE_ODT_READ_OK
      - name: Validar árbol sin egui/eframe
        run: |
          cargo tree --features gui --edges normal --prefix none --format '{p}' | tee dependencies.txt
          if grep -E '^(egui|eframe|egui-[a-z0-9_-]+|epaint) v' dependencies.txt; then
            echo 'ERROR: dependencia egui encontrada'
            exit 1
          fi
      - name: Compilar lector GNOME
        # Keep symbols in the temporary early artifact for portal diagnostics.
        # Both final native output and the packaged executable are stripped later.
        run: cargo rustc --release --locked --features gui --bin wordcraft-gnome -- -C strip=none
      - name: Verify accepted alpha35 workflows in native English and Spanish HiDPI
        run: |
          set -o pipefail
          for language in en es; do
            scale=1
            if test "$language" = es; then scale=2; fi
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GDK_SCALE=$scale GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 2800x2200x24' timeout 120s ./target/release/wordcraft-gnome --workflows35-ui-test 2>&1 | tee workflows35-$language.log
            grep -q WORKFLOWS35_UI_OK workflows35-$language.log
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GDK_SCALE=$scale GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 2800x2200x24' timeout 180s bash tools/workflows35-pointer-test.sh
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflows35-native-controls
          path: workflows35-*.log
      - name: Investigate spacing and real End viewport behavior
        run: |
          set +e
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en LEAF_PENDING_CAPTURE=1 GSK_RENDERER=cairo xvfb-run -a timeout 120s ./target/release/wordcraft-gnome --pending-spacing-ui-test > pending-spacing.log 2>&1
          spacing_status=$?
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1400x1100x24' timeout 120s bash tools/pending-issues-pointer-test.sh
          end_status=$?
          cat pending-spacing.log
          ((spacing_status==0 && end_status==0))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-issue-controls
          path: |
            pending-*.log
            pending-*.png
      - name: Verify native system and dictionary folder controls
        run: |
          for mode in native folder; do
            LANGUAGE=en GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1400x1100x24' dbus-run-session -- timeout 240s bash tools/dictionary84-test.sh ./target/release/wordcraft-gnome "$mode"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dictionary84-native-controls
          path: |
            dictionary84-*.log
            dictionary84-*.png
      - name: Verify unified Review and shared formatting and Elements panels
        run: |
          set -o pipefail
          for language in en es; do
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1400x1100x24' timeout 90s ./target/release/wordcraft-gnome --review29-ui-test 2>&1 | tee review29-$language.log
            grep -q REVIEW29_UI_OK review29-$language.log
          done
      - name: Verify contextual, pinned and Paragraph native controls before packaging
        run: |
          set -o pipefail
          GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1280x900x24' timeout 90s bash tools/context-pointer-test.sh
          GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --test-document --pin-ui-test 2>&1 | tee popover-pin.log
          grep -q POPOVER_PIN_OK popover-pin.log
          GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --test-document --paragraph-ui-test 2>&1 | tee paragraph-popover.log
          grep -q PARAGRAPH_POPOVER_OK paragraph-popover.log
          GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --clipboard-ui-test 2>&1 | tee clipboard-formats.log
          grep -q CLIPBOARD_FORMATS_UI_OK clipboard-formats.log
      - name: Validate grouped Insert and annotation workflows
        run: |
          set -o pipefail
          for language in en es; do
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --annotations-ui-test 2>&1 | tee annotations-$language.log
            grep -q ANNOTATIONS_UI_OK annotations-$language.log
          done
      - name: Editable headers, footers and automatic page fields
        run: |
          set -o pipefail
          GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --headers-ui-test 2>&1 | tee headers-ui.log
          grep -q 'HEADER_FOOTER_UI_OK pointer=false' headers-ui.log
          xvfb-run -a bash tools/header-pointer-test.sh
      - name: Verify alpha29 document controls and all picture gestures
        run: |
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1400x1100x24' timeout 180s bash tools/alpha29-pointer-test.sh
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=es GDK_SCALE=2 GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 2800x2200x24' timeout 180s bash tools/alpha29-pointer-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha29-interactions
          path: |
            review29-*.log
            alpha29-pointer-*.log
            alpha29-pointer-*.png
            alpha31-*.log
            alpha31-*.png
      - name: Verify alpha28 section zoom, page activation, notes and image drags
        run: |
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en GSK_RENDERER=cairo xvfb-run -a timeout 90s bash tools/alpha28-pointer-test.sh
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=es GDK_SCALE=2 GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 2560x1800x24' timeout 90s bash tools/alpha28-pointer-test.sh
      - name: Capture alpha28 public gallery
        run: xvfb-run -a -s '-screen 0 1400x1000x24' bash packaging/capture-gallery.sh native alpha28-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha28-gallery-and-interactions
          path: |
            alpha28-gallery/
            alpha28-pointer-*.log
            alpha28-pointer-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-native-unvalidated
          path: target/release/wordcraft-gnome
          retention-days: 3
      - name: Profile upgraded engine before client optimization
        if: contains(github.event.pull_request.title, '[perf-control]')
        run: |
          set -o pipefail
          mkdir -p perf-control
          XDG_CONFIG_HOME=$(mktemp -d) XDG_CACHE_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en LEAF_PERF_PARAGRAPHS=600 LEAF_PERF_REPORT="$PWD/perf-control/report.json" GSK_RENDERER=cairo xvfb-run -a timeout 180s ./target/release/wordcraft-gnome --performance-ui-test 2>&1 | tee perf-control/probe.log
          grep -q LEAF_PERFORMANCE_OK perf-control/probe.log
          git rev-parse HEAD > perf-control/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: contains(github.event.pull_request.title, '[perf-control]')
        with:
          name: leaf-engine-control-profile
          path: perf-control/
      - name: Verify WordCraft boundary for this performance audit
        if: contains(github.event.head_commit.message, '[perf-candidate]') || contains(github.event.pull_request.title, '[perf-candidate]')
        run: git diff --exit-code c6e7e89e36665775a0fe5294fb8cfd56afd42ba1 -- Cargo.toml Cargo.lock craft-i18n.rev vendor patches
      - name: Verify alpha18 text, theme, navigation and table pointer controls
        run: |
          set -o pipefail
          for language in en es; do
            XDG_CONFIG_HOME=$(mktemp -d) LANGUAGE=$language GSK_RENDERER=cairo xvfb-run -a timeout 60s ./target/release/wordcraft-gnome --sweep18-ui-test 2>&1 | tee sweep18-$language.log
            grep -q SWEEP18_UI_OK sweep18-$language.log
          done
          xvfb-run -a bash tools/table-pointer-test.sh
          xvfb-run -a bash tools/text-pointer-test.sh
      - name: Verify followup font input, links and paragraph gestures
        run: |
          for target in range caret; do
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en LEAF19_RANGE=$target xvfb-run -a timeout 120s bash tools/followup19-pointer-test.sh
          done
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en LEAF19_REFLOW=1 xvfb-run -a timeout 120s bash tools/followup19-pointer-test.sh
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en LEAF19_NARROW=1 LEAF19_LARGE=1 xvfb-run -a timeout 120s bash tools/followup19-pointer-test.sh
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en GDK_SCALE=2 LEAF19_RANGE=caret LEAF19_NARROW=1 LEAF19_LARGE=1 xvfb-run -a -s '-screen 0 2560x1800x24' timeout 120s bash tools/followup19-pointer-test.sh
          for mode in link paragraph; do
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en xvfb-run -a timeout 120s bash tools/followup19-pointer-test.sh ./target/release/wordcraft-gnome "$mode"
          done
      - name: Verify native alpha20 history and ruler gestures
        run: |
          for language in en es; do
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GSK_RENDERER=cairo xvfb-run -a timeout 100s bash tools/sweep20-pointer-test.sh
          done
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=en GDK_SCALE=2 GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 2560x1800x24' timeout 100s bash tools/sweep20-pointer-test.sh
      - name: Native document menu actions
        run: |
          set -o pipefail
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --chrome-ui-test 2>&1 | tee document-chrome.log
          grep -q DOCUMENT_CHROME_OK document-chrome.log
      - name: Verify issue fixes with native controls and pointer input
        run: |
          set -o pipefail
          for language in en es; do
            leaf_config=$(mktemp -d)
            XDG_CONFIG_HOME=$leaf_config XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --issue-sweep-ui-test 2>&1 | tee issues-$language.log
            grep -q ISSUE_SWEEP_UI_OK issues-$language.log
            XDG_CONFIG_HOME=$leaf_config ./target/release/wordcraft-gnome --issue-preferences-read-test
          done
          xvfb-run -a bash tools/comment-pointer-test.sh
          GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --heading-top-test 2>&1 | tee heading-top.log
          grep -q HEADING_TOP_UI_OK heading-top.log
          xvfb-run -a bash tools/interaction-pointer-test.sh
          xvfb-run -a bash tools/split-pointer-test.sh
          xvfb-run -a dbus-run-session -- bash tools/uri-launch-test.sh
          python tools/create_launch_fixture.py /tmp/launch-test.docx
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --save-current-file-test /tmp/launch-test.docx 2>&1 | tee save-current-file.log
          grep -q SAVE_CURRENT_FILE_UI_OK save-current-file.log
      - name: Host-only performance regression
        run: |
          set -o pipefail
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) GSK_RENDERER=cairo xvfb-run -a timeout 120s ./target/release/wordcraft-gnome --host-cache-ui-test 2>&1 | tee host-cache-ui.log
          grep -q LEAF_HOST_CACHE_UI_OK host-cache-ui.log
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[perf-candidate]') || contains(github.event.pull_request.title, '[perf-candidate]')
        with:
          name: leaf-native-unvalidated
          path: baseline-artifact
          run-id: '42369077031'
          github-token: ${{ github.token }}
      - name: Compare baseline and optimized host on the same runner
        if: contains(github.event.head_commit.message, '[perf-candidate]') || contains(github.event.pull_request.title, '[perf-candidate]')
        env:
          LEAF_PERF_BASELINE_SOURCE: '4869c0a37f94dd7f51d796b9fcce281834c66380'
          LEAF_PERF_CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --exit-code "$LEAF_PERF_BASELINE_SOURCE" -- Cargo.toml Cargo.lock craft-i18n.rev vendor patches
          python tools/performance_compare.py baseline-artifact/wordcraft-gnome ./target/release/wordcraft-gnome
      - name: Verify English, Spanish and live dark documents
        run: |
          LANGUAGE=en GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --localization-ui-test 2>&1 | tee localization-en.log
          grep -q 'LOCALIZATION_UI_OK language=en' localization-en.log
          LANGUAGE=es GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --localization-ui-test 2>&1 | tee localization-es.log
          grep -q 'LOCALIZATION_UI_OK language=es' localization-es.log
      - name: Section options and native spelling review
        run: |
          set -o pipefail
          GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --page-options-ui-test 2>&1 | tee page-options-ui.log
          grep -q PAGE_OPTIONS_UI_OK page-options-ui.log
          grep -q DOCUMENT_METADATA_UI_OK page-options-ui.log
          for language in en es; do
            XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=$language GSK_RENDERER=cairo xvfb-run -a timeout 90s ./target/release/wordcraft-gnome --proofing-ui-test 2>&1 | tee proofing-$language.log
            grep -q PROOFING_UI_OK proofing-$language.log
          done
      - name: Native bookmarks and comment threads
        run: |
          set -o pipefail
          # Feature work may reuse a locked transitive crate in the frontend.
          # Preserve every existing dependency, engine package, profile and patch.
          git diff --exit-code 2cd4ef308650686f5b71175c57b5875eb441dd8c -- craft-i18n.rev vendor patches
          python3 - <<'WORDCRAFT_BOUNDARY'
          import subprocess,tomllib
          from pathlib import Path
          base='2cd4ef308650686f5b71175c57b5875eb441dd8c'
          def before(path):return tomllib.loads(subprocess.check_output(['git','show',f'{base}:{path}'],text=True))
          old=before('Cargo.toml');new=tomllib.loads(Path('Cargo.toml').read_text())
          assert all(new['dependencies'].get(name)==spec for name,spec in old['dependencies'].items())
          assert old.get('patch')==new.get('patch')
          assert old.get('profile')==new.get('profile')
          def engine_packages(lock):return [p for p in lock['package'] if p['name']!='wordcraft-gnome']
          assert engine_packages(before('Cargo.lock'))==engine_packages(tomllib.loads(Path('Cargo.lock').read_text()))
          print('WORDCRAFT_BOUNDARY_OK unchanged_existing_dependencies_and_lock_packages')
          WORDCRAFT_BOUNDARY
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -e
            for panel in annotations proofing; do
            for variant in wide narrow dark; do
              args=()
              if test "$variant" = narrow; then args+=(--narrow); fi
              if test "$variant" = dark; then args+=(--dark); fi
              XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) LANGUAGE=es GSK_RENDERER=cairo ./target/release/wordcraft-gnome --$panel-demo "${args[@]}" > "$panel-$variant.log" 2>&1 &
              pid=$!
              for attempt in $(seq 1 200); do
                grep -q DEMO_READY "$panel-$variant.log" && break
                kill -0 "$pid"
                sleep 0.1
              done
              grep -q DEMO_READY "$panel-$variant.log"
              sleep 0.3
              scrot "$panel-$variant.png"
              kill "$pid"
              wait "$pid" || true
            done
            done
          '
      - name: GTK ownership and memory regression
        run: |
          set -o pipefail
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) GSK_RENDERER=cairo xvfb-run -a timeout 150s ./target/release/wordcraft-gnome --lifecycle-ui-test 2>&1 | tee lifecycle-fixed.log
          grep -q LIFECYCLE_UI_OK lifecycle-fixed.log
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) GSK_RENDERER=cairo xvfb-run -a timeout 150s ./target/release/wordcraft-gnome --lifecycle-dialog-test 2>&1 | tee lifecycle-dialogs.log
          grep -q LIFECYCLE_UI_OK lifecycle-dialogs.log
      - name: Keyboard navigation and native print portal handoff
        run: |
          sudo apt-get install -y --no-install-recommends python3-gi dbus-x11
          xvfb-run -a bash tools/keyboard_test.sh ./target/release/wordcraft-gnome
          xvfb-run -a dbus-run-session -- bash tools/print_test.sh ./target/release/wordcraft-gnome
      - name: Vista del motor sin interfaz
        run: |
          cargo run -- --png muestra-wordcraft.png
          test -s muestra-wordcraft.png
      - name: Comparar rendimiento reproducible
        if: ${{ !contains(github.event.head_commit.message, '[release-alpha]') && !contains(github.event.head_commit.message, '[candidate-alpha]') && !contains(github.event.head_commit.message, '[a11y-candidate]') && !contains(github.event.head_commit.message, '[perf-candidate]') && !contains(github.event.head_commit.message, '[refactor-candidate]') && !contains(github.event.pull_request.title, '[candidate-alpha]') }}
        run: |
          cargo run --locked --example performance > performance-debug.txt
          cargo run --release --locked --example performance > performance-release.txt
          cat performance-debug.txt performance-release.txt
          diff <(grep '^CHECK' performance-debug.txt) <(grep '^CHECK' performance-release.txt)
      - name: Identificar versión de prueba
        run: |
          ./target/release/wordcraft-gnome --version | tee version.txt
          grep -q "Leaf 0.1.0-alpha.35" version.txt
      - name: Probar escritorio ancho, ventana estrecha, panel y tema oscuro
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            set -e
            run_case () {
              output="$1"
              shift
              GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document "$@" \
                > "out-${output}.log" 2> "err-${output}.log" &
              pid=$!
              sleep 7
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "err-${output}.log"
                exit 1
              fi
              scrot "$output"
              kill "$pid"
              wait "$pid" || true
            }
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --adaptive-ui-test 2> adaptive-tools.log || { cat adaptive-tools.log; exit 1; }
            grep -q ADAPTIVE_UI_OK adaptive-tools.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --view-pointer-test 2> view-pointer.log &
            view_pid=$!
            for attempt in $(seq 1 300); do
