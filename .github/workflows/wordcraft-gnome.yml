  flatpak-alpha:
    name: Build and validate unpublished Alpha candidate
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[candidate-alpha]') && (needs.test.result == 'success' || (needs.test.result == 'skipped' && contains(github.event.head_commit.message, '[bundle-only]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reused native source and test run identity
        if: contains(github.event.head_commit.message, '[bundle-only]')
        env:
          GH_TOKEN: ${{ github.token }}
          LEAF_CANDIDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          native_run=$(python3 - <<'PY'
          import os, re
          runs = re.findall(r'\[native-run:([0-9]+)\]', os.environ['LEAF_CANDIDATE_MESSAGE'])
          assert len(runs) == 1, 'A reused candidate needs exactly one [native-run:ID] marker'
          print(runs[0])
          PY
          )
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$native_run" > native-run.json
          python3 - <<'PY'
          import json, os, re
          r = json.load(open('native-run.json'))
          assert r['conclusion'] in (None, 'success')
          assert r['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert r['path'] == '.github/workflows/wordcraft-gnome.yml'
          assert re.fullmatch(r'[0-9a-f]{40}', r['head_sha'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LEAF_NATIVE_SOURCE=' + r['head_sha'] + '\n')
              f.write('LEAF_NATIVE_RUN=' + str(r['id']) + '\n')
          PY
          native_source=$(python3 -c "import json; print(json.load(open('native-run.json'))['head_sha'])")
          git cat-file -e "$native_source^{commit}" || git fetch origin "$native_source"
          # These two Flatpak test drivers are not binary inputs. Sandbox-only
          # control/profile changes may reuse the identical native executable.
          git diff --exit-code "$native_source" -- src Cargo.toml Cargo.lock craft-i18n.rev tests vendor po data examples tools patches ':(exclude)tools/dictionary84-pointer-test.sh' ':(exclude)tools/dictionary84-installed-test.sh'
      - name: Wait for the reusable native executable without bypassing validation
        if: contains(github.event.head_commit.message, '[bundle-only]')
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LEAF_NATIVE_RUN" --jq '.conclusion // "pending"')
            case "$conclusion" in
              pending|success) ;;
              *) echo "Native validation ended with $conclusion" >&2; exit 1 ;;
            esac
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LEAF_NATIVE_RUN/artifacts?name=leaf-native-unvalidated" --jq '[.artifacts[] | select(.name == "leaf-native-unvalidated" and .expired == false)] | length')
            if test "$available" -gt 0; then exit 0; fi
            echo "Waiting for the native executable ($attempt/80). Full native success remains required before promotion."
            sleep 15
          done
          echo 'The native executable was not available within 20 minutes.' >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ contains(github.event.head_commit.message, '[bundle-only]') && 'leaf-native-unvalidated' || 'wordcraft-gnome-fase3d-linux' }}
          path: native-artifact
          run-id: ${{ contains(github.event.head_commit.message, '[bundle-only]') && env.LEAF_NATIVE_RUN || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare the same optimized binary while native regressions continue
        if: contains(github.event.head_commit.message, '[bundle-only]')
        run: strip --strip-unneeded native-artifact/wordcraft-gnome
      - name: Install Flatpak and desktop validation tools
        run: |
          # Azure's HTTP package mirror stalled on the runner; use Ubuntu HTTPS.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if path.is_file():
                  text = path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  path.write_text(text)
          for name, uri in [('apt-mirrors.txt', 'https://archive.ubuntu.com/ubuntu'), ('apt-security-mirrors.txt', 'https://security.ubuntu.com/ubuntu')]:
              path = Path('/etc/apt') / name
              if path.is_file():
                  path.write_text(uri + '\n')
          PY
          sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends flatpak desktop-file-utils appstream xvfb xauth scrot xcompmgr libgtk-3-bin librsvg2-common fuse3 python3-gi libgtk-4-1 libadwaita-1-0 poppler-utils gdb xclip xdotool xdg-desktop-portal xdg-desktop-portal-gtk dbus-x11 gettext
          # Ubuntu runner AppArmor restricts bubblewrap's user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.frandavid100.leaf.desktop
          appstreamcli validate --no-net data/io.github.frandavid100.leaf.metainfo.xml
      - name: Download previous alpha for upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0-alpha.32 --pattern 'Leaf-0.1.0-alpha.32-x86_64.flatpak' --dir prior-release
      - name: Build and install the bundle
        run: bash packaging/build-bundle.sh native-artifact/wordcraft-gnome
      - name: Configure GTK portal backend for the folder test
        run: |
          mkdir -p "$HOME/.config/xdg-desktop-portal"
          printf '[preferred]\ndefault=gtk\n' > "$HOME/.config/xdg-desktop-portal/portals.conf"
      - uses: actions/download-artifact@v4
        with:
          name: leaf-native-unvalidated
          path: debug-native
          run-id: ${{ env.LEAF_NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Restore executable permission on the downloaded native drag source
        run: |
          chmod 0755 debug-native/wordcraft-gnome
          debug-native/wordcraft-gnome --version
      - name: Verify alpha35 native controls and real portal image transfer on GNOME 49
        run: bash tools/workflows35-installed-test.sh io.github.frandavid100.leaf /app/bin/leaf dist/workflows35-installed
      - name: Verify installed dictionary folder portal and restart
        env:
          LEAF84_GDB: '1'
          LEAF84_GDB_BINARY: ${{ github.workspace }}/debug-native/wordcraft-gnome
        run: bash tools/dictionary84-installed-test.sh io.github.frandavid100.leaf /app/bin/leaf dist/dictionary84-installed
      - name: Verify FlatPark archive on GNOME 51 at its relocated prefix
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash packaging/flatpark-smoke.sh dist/Leaf-0.1.0-alpha.35-flatpark-x86_64.tar.xz 2>&1 | tee dist/flatpark-smoke.log
          grep -q FLATPARK_GNOME51_RELOCATION_OK dist/flatpark-smoke.log
      - name: Exercise the installed sandbox and desktop launcher
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash packaging/smoke-test.sh 2>&1 | tee dist/flatpak-smoke.log
      - name: Verify installed spacing and Home End navigation
        run: dbus-run-session -- bash tools/pending-installed-test.sh io.github.frandavid100.leaf /app/bin/leaf dist/pending-installed
      - name: Compare failed font input with the published Alpha30 control
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/alpha30-font-control
          gh release download v0.1.0-alpha.30 --pattern 'Leaf-0.1.0-alpha.30-x86_64.flatpak' --dir "$RUNNER_TEMP/alpha30-font-control"
          git show v0.1.0-alpha.30:tools/interaction-pointer-test.sh > "$RUNNER_TEMP/alpha30-font-control/driver.sh"
          flatpak --user install -y --noninteractive "$RUNNER_TEMP/alpha30-font-control/Leaf-0.1.0-alpha.30-x86_64.flatpak"
          set +e
          (
            cd dist/alpha30-font-control
            export LEAF_CONTROL_DRIVER="$RUNNER_TEMP/alpha30-font-control/driver.sh"
            export LEAF_CONTROL_RUNNER="$GITHUB_WORKSPACE/tools/flatpak_print_run.sh"
            xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash -c 'bash "$LEAF_CONTROL_DRIVER" "$LEAF_CONTROL_RUNNER"' > driver.log 2>&1
          )
          status=$?
          printf 'ALPHA30_FONT_CONTROL_EXIT=%s\n' "$status" | tee dist/alpha30-font-control/result.log
          cat dist/alpha30-font-control/interactions-pointer.log || true
      - name: Verify Alpha29 controls and pointer gestures in the installed Flatpak
        run: |
          mkdir -p "$HOME/.var/app/io.github.frandavid100.leaf/cache" dist/alpha29-installed
          cat > "$RUNNER_TEMP/leaf29-installed.sh" <<'INSTALLED29'
          #!/usr/bin/env bash
          exec flatpak run --user --branch=alpha --env=LC_ALL=en_US.UTF-8 --env=LANGUAGE="${LANGUAGE:-en}" --env=GDK_SCALE="${GDK_SCALE:-1}" --env=GSK_RENDERER=cairo --env=LEAF29_ACK_DIR="$LEAF29_ACK_DIR" --command=sh io.github.frandavid100.leaf -c 'export XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d); exec /app/bin/leaf "$@"' leaf "$@"
          INSTALLED29
          export LEAF29_ACK_PARENT="$HOME/.var/app/io.github.frandavid100.leaf/cache"
          LANGUAGE=en GDK_SCALE=1 xvfb-run -a -s '-screen 0 1400x1100x24' dbus-run-session -- timeout 180s bash tools/alpha29-pointer-test.sh "$RUNNER_TEMP/leaf29-installed.sh"
          LANGUAGE=es GDK_SCALE=2 xvfb-run -a -s '-screen 0 2800x2200x24' dbus-run-session -- timeout 180s bash tools/alpha29-pointer-test.sh "$RUNNER_TEMP/leaf29-installed.sh"
          mv alpha29-pointer-*.log alpha29-pointer-*.png alpha31-*.log alpha31-*.png dist/alpha29-installed/
      - name: Retain installed pointer evidence on failure too
        if: always()
        run: |
          mkdir -p dist/alpha29-installed
          shopt -s nullglob
          files=(alpha29-pointer-*.log alpha29-pointer-*.png alpha31-*.log alpha31-*.png)
          if ((${#files[@]})); then mv "${files[@]}" dist/alpha29-installed/; fi
      - name: Capture the installed alpha28 gallery
        run: xvfb-run -a -s '-screen 0 1400x1000x24' dbus-run-session -- bash packaging/capture-gallery.sh flatpak dist/alpha28-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha28-installed-gallery
          path: dist/alpha28-gallery/
          retention-days: 14
      - name: Inspect installed history states and clipped rulers in dark and narrow views
        # The first seven existing sweep stages exercise history; capture both
        # ruler edges before the wide-window-only geometry stage is acknowledged.
        run: |
          cat > "$RUNNER_TEMP/leaf21-history-prefix.sh" <<'HISTORY_PREFIX'
          #!/usr/bin/env bash
          set -euo pipefail
          runner=${1:-./target/release/wordcraft-gnome}
          cmd=("$runner"); [[ "$runner" != *.sh ]] || cmd=(bash "$runner")
          export LEAF20_ACK_DIR
          LEAF20_ACK_DIR=$(mktemp -d "${LEAF20_ACK_PARENT:-/tmp}/leaf20-ack.XXXXXX")
          log=sweep20-pointer-${LANGUAGE:-en}-${GDK_SCALE:-1}.log
          "${cmd[@]}" --sweep20-pointer-test >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$LEAF20_ACK_DIR"' EXIT
          last=0
          while kill -0 "$pid" 2>/dev/null; do
            count=$(grep -c '^SWEEP20_READY ' "$log" || true)
            if (( count <= last )); then sleep 0.05; continue; fi
            line=$(grep '^SWEEP20_READY ' "$log" | sed -n "$((last+1))p")
            read -r _ stage role ax ay bx by <<< "$line"
            window=$(xdotool search --onlyvisible --name '^Leaf Sweep20 Regression$' | head -n1)
            xdotool windowfocus --sync "$window"
            case "$role" in
              click) xdotool mousemove --window "$window" "$ax" "$ay" click 1 ;;
              second) xdotool key Home Down Return ;;
              cancel) xdotool key Escape ;;
              hover) xdotool mousemove --window "$window" "$ax" "$ay" ;;
              ruler-keyboard) xdotool key ctrl+alt+r ;;
              drag) xdotool mousemove --window "$window" "$ax" "$ay" mousedown 1 mousemove --sync --window "$window" "$bx" "$by"; sleep 0.3; xdotool mouseup 1 ;;
              cancel-drag) xdotool mousemove --window "$window" "$ax" "$ay" mousedown 1 mousemove --sync --window "$window" "$bx" "$by"; sleep 0.2; xdotool key Escape; xdotool mouseup 1 ;;
              right) xdotool key Right ;;
              undo) xdotool key ctrl+z ;;
              *) exit 1 ;;
            esac
            sleep 0.55
            scrot "${log%.log}-${stage}.png"
            touch "$LEAF20_ACK_DIR/$stage"
            last=$((last+1))
            if (( stage == 6 )); then
              for attempt in $(seq 1 100); do
                grep -q '^SWEEP20_READY 7 ' "$log" && break
                kill -0 "$pid"
                sleep 0.05
              done
              grep -q '^SWEEP20_READY 7 ' "$log"
              read -r _ _ _ hx hy < <(grep '^SWEEP20_READY 7 ' "$log")
              if [[ "${LEAF21_CLIP:-}" == 1 ]]; then
                xdotool key ctrl+plus ctrl+plus
                sleep 0.5
              fi
              xdotool mousemove --window "$window" "$hx" "$hy"
              sleep 0.6
              scrot history-prefix-horizontal.png
              scale=${GDK_SCALE:-1}
              xdotool mousemove --window "$window" "$((6*scale))" "$((200*scale))"
              sleep 0.6
              scrot history-prefix-vertical.png
              kill "$pid"
              wait "$pid" || true
              echo HISTORY_PREFIX_OK
              exit 0
            fi
          done
          wait "$pid"
          grep -q SWEEP20_POINTER_OK "$log"
          cat "$log"
          HISTORY_PREFIX
          cat > "$RUNNER_TEMP/leaf21-history-flatpak.sh" <<'FLATPAK_RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          flags=()
          [[ "$LEAF21_VARIANT" != dark-* ]] || flags+=(--dark)
          [[ "$LEAF21_VARIANT" != *-narrow-* ]] || flags+=(--narrow)
          exec flatpak run --socket=x11 --nosocket=wayland --command=sh   --env="LANGUAGE=$LANGUAGE" --env="GDK_SCALE=$GDK_SCALE"   --env="LEAF20_ACK_DIR=$LEAF20_ACK_DIR"   --env="LEAF21_CONFIG=$LEAF21_CONFIG" --env="LEAF21_STATE=$LEAF21_STATE"   io.github.frandavid100.leaf -c   'export XDG_CONFIG_HOME="$LEAF21_CONFIG" XDG_STATE_HOME="$LEAF21_STATE"; exec leaf "$@"' sh "${flags[@]}" "$@"
          FLATPAK_RUNNER
          export LEAF20_ACK_PARENT="$HOME/.var/app/io.github.frandavid100.leaf/cache"
          mkdir -p "$LEAF20_ACK_PARENT"
          for variant in dark-wide-1 light-narrow-1 dark-narrow-2; do
            export LEAF21_VARIANT="$variant" LANGUAGE=en GDK_SCALE="${variant##*-}"
            export LEAF21_CONFIG LEAF21_STATE LEAF21_CLIP=1
            isolated=$(mktemp -d "$LEAF20_ACK_PARENT/history.XXXXXX")
            LEAF21_CONFIG="$isolated/config"
            LEAF21_STATE="$isolated/state"
            mkdir -p "$LEAF21_CONFIG/wordcraft-gnome" "$LEAF21_STATE"
            # Explicit Light is isolated from earlier smoke-test preferences.
            printf '{"theme":1}\n' > "$LEAF21_CONFIG/wordcraft-gnome/preferences.json"
            evidence="$GITHUB_WORKSPACE/dist/history-$variant"
            mkdir -p "$evidence"
            (
              cd "$evidence"
              xvfb-run -a -s '-screen 0 2560x1800x24' dbus-run-session --       timeout 55s bash "$RUNNER_TEMP/leaf21-history-prefix.sh"       "$RUNNER_TEMP/leaf21-history-flatpak.sh" > history-prefix-driver.log 2>&1
              grep -q HISTORY_PREFIX_OK history-prefix-driver.log
            )
            flatpak kill io.github.frandavid100.leaf || true
          done
      - name: Retain installed interaction evidence
        if: always()
        run: |
          shopt -s nullglob
          evidence=(followup19-*.log followup19-*.png sweep20-pointer-*.log sweep20-pointer-*.png interactions-pointer.log interaction-*.png vista-texto*.png)
          for file in "${evidence[@]}"; do
            if [[ -f "$file" ]]; then cp "$file" dist/; fi
          done
      - name: Verify installed Flatpak print portal handoff
        run: |
          cat > print-sandbox-runner <<'SH'
          #!/usr/bin/env bash
          exec bash tools/flatpak_print_run.sh "$@"
          SH
          chmod +x print-sandbox-runner
          xvfb-run -a dbus-run-session -- bash tools/print_test.sh "$PWD/print-sandbox-runner"
          cp print-ui-*.log print-portal-*.log dist/
          xvfb-run -a dbus-run-session -- bash tools/uri-launch-test.sh tools/flatpak_print_run.sh
          cp uri-launch.log dist/flatpak-uri-launch.log
      - name: Installed document text with real AT-SPI and Orca
        env:
          GTK_A11Y: atspi
          NO_AT_BRIDGE: '0'
          GSK_RENDERER: cairo
          LANGUAGE: en
          LANG: C.UTF-8
          XDG_SESSION_TYPE: x11
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          sudo apt-get install -y --no-install-recommends openbox orca python3-pyatspi at-spi2-core gsettings-desktop-schemas
          set -o pipefail
          xvfb-run -a dbus-run-session -- /usr/bin/python3 tools/accessibility_audit.py io.github.frandavid100.leaf --sandbox 2>&1 | tee dist/flatpak-accessibility.log
          grep -q AT_SPI_DOCUMENT_TEXT_OK dist/flatpak-accessibility.log
          grep -q ORCA_DOCUMENT_SPEECH_OK dist/flatpak-accessibility.log
          cp -R a11y-results dist/accessibility-audit
      - name: Require complete success of the parallel native regression run
        if: contains(github.event.head_commit.message, '[bundle-only]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 100); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LEAF_NATIVE_RUN" --jq '.status + ":" + (.conclusion // "")')
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "Native validation failed: $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo 'Native validation did not finish within the candidate window.' >&2
          exit 1
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[bundle-only]')
        with:
          name: wordcraft-gnome-fase3d-linux
          path: native-validated
          run-id: ${{ env.LEAF_NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Compare packaged executable with the fully validated optimized executable
        if: contains(github.event.head_commit.message, '[bundle-only]')
        run: cmp native-artifact/wordcraft-gnome native-validated/wordcraft-gnome
      - name: Record immutable candidate identity and release notes
        env:
          LEAF_CANDIDATE_SHA: ${{ github.sha }}
          LEAF_CANDIDATE_RUN: ${{ github.run_id }}
          LEAF_NATIVE_SHA: ${{ env.LEAF_NATIVE_SOURCE || github.sha }}
          LEAF_NATIVE_RUN: ${{ env.LEAF_NATIVE_RUN || github.run_id }}
          LEAF_AUTO_PUBLISH: ${{ contains(github.event.head_commit.message, '[auto-publish-alpha]') }}
        run: |
          cp packaging/RELEASE_NOTES.md dist/RELEASE_NOTES.md
          python3 - <<'PYTHON'
          import json, os, pathlib
          pathlib.Path('dist/candidate.json').write_text(json.dumps({
              'version': '0.1.0-alpha.35', 'source': os.environ['LEAF_CANDIDATE_SHA'],
              'run_id': int(os.environ['LEAF_CANDIDATE_RUN']),
              'native_source': os.environ['LEAF_NATIVE_SHA'],
              'native_run_id': int(os.environ['LEAF_NATIVE_RUN']),
              'publication': ('automatic publication authorized by David; promote these exact files without rebuilding' if os.environ.get('LEAF_AUTO_PUBLISH') == 'true' else 'requires maintainer approval; promote these exact files without rebuilding')
          }, indent=2) + '\n')
          PYTHON
      - name: Package synthetic dictionary test files
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("dist/Leaf-0.1.0-alpha.35-dictionary-test.zip", "w", ZIP_DEFLATED) as archive:
              for source in sorted(Path("tests/fixtures/dictionary84").iterdir()):
                  if source.is_file(): archive.write(source, "Leaf-dictionary-test/" + source.name)
          PYTHON
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Leaf-*.flatpak Leaf-*-flatpark-x86_64.tar.xz Leaf-*-dictionary-test.zip INSTALL.md source-commit.txt runtime.txt runtime-commit.txt flatpak-metadata.txt flatpak-smoke.log flatpark-smoke.log candidate.json RELEASE_NOTES.md > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat candidate.json
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-flatpak-alpha
          path: dist/
          if-no-files-found: warn

  lifecycle-baseline:
    if: contains(github.event.head_commit.message, '[lifecycle-baseline]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned WordCraft Language data
        run: bash tools/prepare-language-data.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev xvfb xauth
      - run: cargo build --release --locked --features gui --bin wordcraft-gnome
      - name: Measure original ownership and RSS without publishing
        run: |
          set -o pipefail
          XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d) GSK_RENDERER=cairo xvfb-run -a timeout 150s ./target/release/wordcraft-gnome --lifecycle-audit 2>&1 | tee lifecycle-baseline.log
          grep -q LIFECYCLE_BASELINE_OK lifecycle-baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-baseline
          path: lifecycle-baseline.log
