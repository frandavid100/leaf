# Standalone snapshot of WordCraft 0.17.0; compatibility delta: patches/README.md.
[package]
name = "wordcraft-formats"
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pinned WordCraft formats with Leaf ODT compatibility preservation"

[dependencies]
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d", features = ["image"] }
wordcraft-metafile = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
base64 = { version = "0.23" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
quick-xml = { version = "0.41" }
zip = { version = "3", default-features = false, features = ["deflate"] }
cfb = { version = "0.15" }
encoding_rs = { version = "0.8" }
chardetng = { version = "1" }
log = { version = "0.4" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
aes = { version = "0.9" }
sha1 = { version = "0.11" }
sha2 = { version = "0.11" }
hmac = { version = "0.13" }
getrandom = { version = "0.3" }
zeroize = { version = "1" }
miniz_oxide = { version = "0.9" }

[target."cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))".dependencies]
js-sys = { version = "0.3" }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d", features = ["test-support"] }
proptest = { version = "1" }
