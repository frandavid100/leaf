[package]
name = "wordcraft-gnome"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false
default-run = "wordcraft-gnome-smoke"
description = "Interfaz GTK4/libadwaita experimental para el motor independiente de WordCraft"

[features]
default = []
gui = ["dep:gtk", "dep:adw"]

[[bin]]
name = "wordcraft-gnome"
path = "src/bin/gnome.rs"
required-features = ["gui"]

[[bin]]
name = "wordcraft-gnome-smoke"
path = "src/main.rs"

[dependencies]
# Anclado a una revisión concreta para reproducir cada compilación.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
wordcraft-formats = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
# Reuse the locked tokenizer for bounded native clipboard attribute adaptation.
quick-xml = "0.41"
serde_json = "1"
# Reuse the locked matcher to expand WordCraft regex captures before case adaptation.
regex-automata = "0.4"
# Already used and locked by WordCraft; reuse UAX #29 boundaries for AT-SPI.
unicode-segmentation = "1.13"
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"], optional = true }

# WordCraft usa un backend PDF modificado. Los [patch] de una dependencia
# no se heredan: el proyecto consumidor debe declarar el mismo reemplazo.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }

# Production binaries optimize the renderer and engine as well as the GTK host.
# Keep unwinding: upstream uses catch_unwind in file/recovery operations.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# The formats snapshot retains only the compatibility delta in patches/README.md.
[patch."https://github.com/storytold/wordcraft"]
wordcraft-formats = { path = "vendor/wordcraft-formats" }
